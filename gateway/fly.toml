app = "realtime-tts-gateway"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"
  # Set via `flyctl secrets set WORKER_WS_URL=wss://<runpod-endpoint>` once RunPod is live.
  WORKER_WS_URL = "ws://127.0.0.1:8765"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Kept warm (was 0) so the pod-idle-teardown timer and in-memory GPU pod state
  # actually run continuously — letting the gateway itself scale to zero would mean
  # nothing ever notices the GPU pod has gone idle and needs tearing down.
  min_machines_running = 1

[[mounts]]
  source = "realtime_tts_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
