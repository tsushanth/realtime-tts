app = "dubbing-worker"
primary_region = "iad"

[build]
  dockerfile = "./dubbing/Dockerfile"

[env]
  PORT = "8090"
  TTS_GATEWAY_BASE = "https://api.readaloudai.org"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
