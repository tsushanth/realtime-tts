[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "readaloud"
version = "0.1.0"
description = "Python client for the ReadAloud streaming text-to-speech API (WebSocket and HTTP streaming)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sushanth Tiruvaipati" }]
keywords = ["tts", "text-to-speech", "speech-synthesis", "streaming", "realtime", "readaloud", "piper", "kokoro", "voice"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]
dependencies = ["websockets>=13", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://readaloudai.org"
Documentation = "https://readaloudai.org/developers"
Repository = "https://github.com/tsushanth/realtime-tts"
Issues = "https://github.com/tsushanth/realtime-tts/issues"
MCP = "https://readaloudai.org/developers/mcp"

[tool.setuptools.package-data]
readaloud = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
