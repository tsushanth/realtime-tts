app = "piper-tts-sjc"
primary_region = "sjc"

[build]

[env]
  ORT_INTRA_THREADS = "4"
  PORT = "8080"
  MAX_CONNECTIONS = "4"
  USAGE_REPORT_URL = "https://api.readaloudai.org/admin/usage/report"

# Public endpoint (wss://piper-tts-sjc.fly.dev/tts) for the ReadAloud API: clients get a
# short-lived session token from api.readaloudai.org/tts/authorize {engine:"piper"} and
# connect directly. Also still reachable privately via piper-tts-sjc.internal:8080 with the
# static AUTH_TOKEN. Never auto-stop: a stopped machine would reintroduce cold starts.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 4
    hard_limit = 6

[[vm]]
  size = "shared-cpu-4x"
  memory = "2gb"
