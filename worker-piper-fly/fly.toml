app = "piper-tts-sjc"
primary_region = "sjc"

[build]

[env]
  ORT_INTRA_THREADS = "4"
  PORT = "8080"
  MAX_CONNECTIONS = "4"
  VOICES_DIR = "/voices"
  USAGE_REPORT_URL = "https://api.readaloudai.org/admin/usage/report"

# Public endpoint (wss://piper-tts-sjc.fly.dev/tts) for the ReadAloud API: clients get a
# short-lived session token from api.readaloudai.org/tts/authorize {engine:"piper"} and
# connect directly. Also still reachable privately via piper-tts-sjc.internal:8080 with the
# static AUTH_TOKEN. min_machines_running = 1 keeps one machine always warm (no cold starts);
# auto_stop_machines/auto_start_machines let Fly scale extra machines up under load and back
# down again once idle (voice storage now lives in Tigris, so every machine is stateless and
# safe to stop/start).
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 4  # start conservative; raise once a load test confirms headroom
                             # NOTE (2026-09-23, re-verified on flyctl v0.4.106): this key
                             # still doesn't show up in `fly config show -a piper-tts-sjc` or
                             # the live machine config, even after upgrading flyctl - looks
                             # like a legacy/dead config key in this Fly version rather than a
                             # bug specific to one flyctl build. That's NOT a functional gap:
                             # `fly scale count <n> -a piper-tts-sjc` is the mechanism that
                             # actually governs machine count on this account, and it works -
                             # `fly scale count 4` provisioned 4 real machines (confirmed via
                             # `fly status`), and a real load test against production confirmed
                             # auto_start_machines actually brings a stopped machine up under
                             # load. See LOAD_TEST.md and the Task 4 closure report for the
                             # independently-reproduced numbers.
  [http_service.concurrency]
    # "connections", not "requests": /tts sessions are long-lived WebSocket connections, and
    # a "requests" counter only tracks the HTTP upgrade (which completes instantly), so it
    # never reflects how many sessions are actually open and never triggers a scale-up.
    type = "connections"
    soft_limit = 3   # below MAX_CONNECTIONS=4 (per-machine app-level cap) so Fly starts a new
                      # machine before the app-level "at capacity" rejection ever fires
    hard_limit = 4

# NOTE: no [mounts]/volume here on purpose. Customer voices are the source of truth in Tigris
# (see voice_storage.py) since the Task 1-3 migration; VOICES_DIR is now just a local, disposable
# LRU disk cache that is safe to lose on machine stop/restart. A [mounts] volume can only attach
# to one machine at a time, which structurally blocks Fly from creating the extra machines
# max_machines_running/fly scale count ask for - confirmed the hard way during Task 4: with the
# volume still declared, `fly deploy` refused to proceed non-interactively at all and had to
# destroy the existing volume-bound machine first. This was caught and fixed BEFORE any load
# test ran, so it was never itself observed pinning machine count under real load; it's a
# structural attach-conflict, confirmed via the deploy-time failure, not a load-test finding.
# The scale-out load test that ran afterward (with this block already removed) hit two separate,
# also-real blockers - an inert `max_machines_running` key on the installed flyctl, and an
# exhausted Fly org machine quota - both resolved; see LOAD_TEST.md and the Task 4 closure report
# for that separate history and the re-verified numbers.

[[vm]]
  size = "shared-cpu-4x"
  memory = "2gb"
